<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Escáner de Boletos</title>

  <style>

  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
  }

  #lector-qr {
    max-width: 500px;
    margin: 20px auto;
  }

  #resultado {
    max-width: 500px;
    margin: 20px auto;
    padding: 25px;
    border-radius: 15px;
    font-size: 18px;
    background: #eeeeee;
  }

  .exito {
    background: #d4edda;
    border: 3px solid #28a745;
    color: #155724;
  }

  .error {
    background: #f8d7da;
    border: 3px solid #dc3545;
    color: #721c24;
  }

  .esperando {
    background: #eeeeee;
    border: 3px solid #999999;
    color: #333333;
  }

</style>

  <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

  <h1>🎟️ Escáner de Boletos</h1>

  <p>
    Apunta la cámara hacia el código QR.
  </p>

  <div id="lector-qr"></div>

  <div id="resultado">
    Esperando QR...
  </div>

  <script>

    const URL_API =
  "https://script.google.com/macros/s/AKfycbwQinogcikJu0IsNGH6jPSfpQXqyRcMnoC3VFT_Wl5Fc_0ebuyx7UQ2S84BYFFTpws/exec";

    const lector = new Html5Qrcode("lector-qr");

    let procesando = false;

    lector.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: 250
      },
    function(codigoEscaneado) {

  if (procesando) {
    return;
  }

  procesando = true;

  document.getElementById("resultado").className = "esperando";

document.getElementById("resultado").innerHTML =
  "<h2>⏳ VERIFICANDO BOLETO...</h2>";

  const url =
    URL_API +
    "?codigo=" +
    encodeURIComponent(codigoEscaneado);

  fetch(url)
    .then(function(respuesta) {

      return respuesta.text();

    })
   .then(function(datos) {

  const resultado = JSON.parse(datos);

  if (resultado.ok) {

    document.getElementById("resultado").className = "exito";

document.getElementById("resultado").innerHTML =
  `
  <h2>✅ INGRESO REGISTRADO</h2>

  <p>
    <strong>Boleto:</strong> ${resultado.numero}
  </p>

  <p>
    <strong>Comprador:</strong> ${resultado.comprador}
  </p>

  <p>
    <strong>Fecha:</strong> ${resultado.fecha}
  </p>

  <p>
    <strong>Hora:</strong> ${resultado.hora}
  </p>
  `;

  } else {

    document.getElementById("resultado").className = "error";

document.getElementById("resultado").innerHTML =
  `
  <h2>${resultado.mensaje}</h2>

  ${
    resultado.numero
      ? "<p><strong>Boleto:</strong> " + resultado.numero + "</p>"
      : ""
  }

  ${
    resultado.comprador
      ? "<p><strong>Comprador:</strong> " + resultado.comprador + "</p>"
      : ""
  }
  `;

  }

     setTimeout(function() {
    
      procesando = false;
    
    }, 5000);

})
  .catch(function(error) {

  document.getElementById("resultado").textContent =
    "❌ Error de conexión";

  console.error(error);

});

},
      function(error) {

        // No mostramos los errores normales de lectura.

      }
    );

  </script>

</body>

</html>
