<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Escáner de Boletos</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

  <h1>🎟️ Escáner de Boletos</h1>

  <p>
    Apunta la cámara hacia el código QR.
  </p>

  <div id="lector-qr"></div>

  <p id="resultado">
    Esperando QR...
  </p>

  <script>

    const URL_API =
  "https://script.google.com/macros/s/AKfycbwQinogcikJu0IsNGH6jPSfpQXqyRcMnoC3VFT_Wl5Fc_0ebuyx7UQ2S84BYFFTpws/exec";

    const lector = new Html5Qrcode("lector-qr");

    let procesando = false;

    lector.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: 250
      },
    function(codigoEscaneado) {

  if (procesando) {
    return;
  }

  procesando = true;

  document.getElementById("resultado").textContent =
    "⏳ Verificando boleto...";

  const url =
    URL_API +
    "?codigo=" +
    encodeURIComponent(codigoEscaneado);

  fetch(url)
    .then(function(respuesta) {

      return respuesta.text();

    })
   .then(function(datos) {

  const resultado = JSON.parse(datos);

  if (resultado.ok) {

    document.getElementById("resultado").innerHTML =
      `
      <strong>${resultado.mensaje}</strong><br><br>
      Boleto: ${resultado.numero}<br>
      Comprador: ${resultado.comprador}<br>
      Fecha: ${resultado.fecha}<br>
      Hora: ${resultado.hora}
      `;

  } else {

    document.getElementById("resultado").innerHTML =
      `
      <strong>${resultado.mensaje}</strong><br><br>
      ${resultado.numero ? "Boleto: " + resultado.numero + "<br>" : ""}
      ${resultado.comprador ? "Comprador: " + resultado.comprador : ""}
      `;

  }

     setTimeout(function() {
    
      procesando = false;
    
    }, 5000);

})
  .catch(function(error) {

  document.getElementById("resultado").textContent =
    "❌ Error de conexión";

  console.error(error);

});

},
      function(error) {

        // No mostramos los errores normales de lectura.

      }
    );

  </script>

</body>

</html>
