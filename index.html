<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Escáner de Boletos</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

  <h1>🎟️ Escáner de Boletos</h1>

  <p>
    Apunta la cámara hacia el código QR.
  </p>

  <div id="lector-qr"></div>

  <p id="resultado">
    Esperando QR...
  </p>

  <script>

    const URL_API =
  "https://script.google.com/macros/s/AKfycbwQinogcikJu0IsNGH6jPSfpQXqyRcMnoC3VFT_Wl5Fc_0ebuyx7UQ2S84BYFFTpws/exec";

    const lector = new Html5Qrcode("lector-qr");

    lector.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: 250
      },
      function(codigoEscaneado) {

  document.getElementById("resultado").textContent =
    "Enviando código...";

  const url =
    URL_API +
    "?codigo=" +
    encodeURIComponent(codigoEscaneado);

  const ventana = window.open(url, "_blank");

  if (!ventana) {

    document.getElementById("resultado").textContent =
      "❌ El navegador bloqueó la prueba";

    return;
  }

  document.getElementById("resultado").textContent =
    "✅ Código enviado: " + codigoEscaneado;

},
      function(error) {

        // No mostramos los errores normales de lectura.

      }
    );

  </script>

</body>

</html>
